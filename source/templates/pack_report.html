<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IncidentPilot - Orbit incident report</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; color: #111827; background: #f3f4f6; margin: 0; }
        .toolbar { background: var(--bg); color: var(--text); padding: 12px 24px; display: flex; gap: 10px; align-items: center; }
        .toolbar b { margin-right: auto; }
        .toolbar a, .toolbar button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; text-decoration: none; cursor: pointer; font-size: 14px; }
        .toolbar a.ghost { background: var(--surface-3); }
        .page { max-width: 1100px; margin: 28px auto; background: #fff; padding: 40px 48px; border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
        h1 { font-size: 26px; border-bottom: 3px solid #4f46e5; padding-bottom: 10px; }
        h2 { font-size: 18px; color: #312e81; margin-top: 28px; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 10px 0; }
        th, td { border: 1px solid #e5e7eb; padding: 7px 9px; text-align: left; vertical-align: top; }
        th { background: #eef2ff; }
        code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
        li { margin-bottom: 4px; }
        hr { border: 0; border-top: 1px solid #e5e7eb; margin-top: 28px; }
        em { color: #6b7280; font-size: 12px; }
        @media print { .toolbar { display: none; } body { background: #fff; } .page { box-shadow: none; margin: 0; max-width: none; padding: 0; } }
    </style>
</head>
<body>
    <div class="toolbar">
        <b>IncidentPilot report</b>
        <button onclick="window.print()">Save as PDF / Print</button>
        <a class="ghost" href="/pack/report.md{% if incident %}?incident={{ incident }}{% endif %}">Download .md</a>
        <a class="ghost" href="/pack">Back to Orbit board</a>
    </div>
    <div class="page">
        {{ report_html|safe }}
    </div>
</body>
</html>
